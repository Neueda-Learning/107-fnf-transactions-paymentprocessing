spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payments_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:n3u3da!}

spring.sql.init.mode=always

# Optional - Hibernate automatically detects MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate DDL settings - auto-create tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

server.port=${SERVER_PORT:8080}

